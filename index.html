<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Desi Gallery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0c10;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 1rem 0.75rem 80px; /* Extra padding bottom for fixed navbar */
            min-height: 100vh;
            color: #e0f0ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 10%, rgba(0, 255, 255, 0.08) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(255, 0, 255, 0.08) 0%, transparent 35%),
                        radial-gradient(circle at 40% 90%, rgba(0, 200, 255, 0.06) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .app { max-width: 720px; width: 100%; margin: 0 auto; }

        .header {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 1rem; padding: 0 0.25rem; gap: 10px;
        }

        .header h1 {
            font-size: 1.8rem; font-weight: 700; letter-spacing: 2px;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            -webkit-background-clip: text; background-clip: text;
            color: transparent; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            filter: drop-shadow(0 0 6px #00ffff88); cursor: pointer;
        }

        /* Search container ab bottom bar me shift ho gaya hai */
        .search-container { display: none; } /* Hide top search */

        .info-bar {
            width: 100%; text-align: center; font-size: 0.85rem;
            color: #00ffffaa; margin-bottom: 1rem; letter-spacing: 0.5px;
        }
        .info-bar span { color: #fff; font-weight: 600; }

        .video-grid { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem; }

        .card {
            background: rgba(12, 18, 26, 0.85); backdrop-filter: blur(8px);
            border-radius: 24px; overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.2), 0 8px 20px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .thumb-wrapper {
            width: 100%; background: #05080c; overflow: hidden;
            position: relative; line-height: 0; min-height: 150px;
        }

        .thumb-wrapper img { width: 100%; height: auto; display: block; object-fit: contain; }

        .bookmark-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%; width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.2rem; color: #888;
            transition: all 0.3s; z-index: 5; backdrop-filter: blur(5px);
        }
        .bookmark-btn:hover { transform: scale(1.1); border-color: #00ffff; color: #00ffff; }
        .bookmark-btn.saved { color: #00ffff; border-color: #00ffff; box-shadow: 0 0 15px #00ffff88; }

        .title-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 10px; padding: 0.9rem 1rem 0.4rem;
        }

        .title {
            font-size: 0.95rem; font-weight: 500; line-height: 1.4;
            color: #ffffffdd; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; flex: 1;
        }

        .size-badge {
            background: rgba(0, 255, 255, 0.1); border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff; font-size: 0.75rem; font-weight: 700;
            padding: 0.25rem 0.6rem; border-radius: 20px; white-space: nowrap;
        }

        .action-row { display: flex; gap: 10px; margin: 0.6rem 1rem 1.2rem; }

        .play-btn {
            flex: 1; background: linear-gradient(90deg, #00c8ff, #aa00ff);
            border: none; border-radius: 60px; padding: 0.8rem 0;
            text-align: center; font-weight: 700; font-size: 1rem;
            letter-spacing: 1.5px; color: #fff; text-decoration: none;
            box-shadow: 0 0 15px #00aaff, 0 0 25px #aa00ff55;
            display: flex; align-items: center; justify-content: center;
        }

        .icon-btn {
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(0, 255, 255, 0.1); border: 1px solid rgba(0, 255, 255, 0.4);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #00ffff; transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.1);
        }
        .icon-btn:hover { background: rgba(0, 255, 255, 0.2); box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); transform: scale(1.05); }
        .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .pagination { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; margin-top: 1.5rem; }
        .page-numbers { display: flex; justify-content: center; align-items: center; gap: 0.6rem; flex-wrap: wrap; }

        .page-btn {
            background: rgba(10, 20, 25, 0.4); border: 1px solid rgba(0, 255, 255, 0.4);
            color: #88ddff; font-weight: 600; font-size: 1rem; border-radius: 50%;
            cursor: pointer; width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
        }

        .page-btn.active {
            background: linear-gradient(135deg, #00c8ff, #aa00ff);
            border: 1px solid #fff; color: #fff;
            box-shadow: 0 0 20px #00c8ff; transform: scale(1.1);
        }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .goto-wrapper {
            display: flex; align-items: center; background: rgba(5, 15, 20, 0.6);
            border: 2px solid #00ffff77; border-radius: 50px; padding: 0.3rem;
        }
        .goto-wrapper label { font-size: 0.85rem; font-weight: bold; color: #00ffff; padding: 0 1rem; }
        .goto-input {
            width: 65px; background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(0, 255, 255, 0.3); border-radius: 50px;
            padding: 0.5rem; color: #fff; font-weight: bold; text-align: center; outline: none;
        }
        .goto-btn {
            background: linear-gradient(135deg, #00c8ff, #aa00ff);
            border: none; border-radius: 50px; padding: 0.5rem 1.2rem;
            color: #fff; font-weight: 800; cursor: pointer; margin-left: 0.3rem;
        }

        .status {
            text-align: center; padding: 2rem 1rem; font-size: 1.1rem;
            color: #88ddff; background: #0d141ecc;
            border-radius: 50px; border: 1px dashed #00ffff88;
        }

        .toast {
            position: fixed; bottom: 90px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #00c8ff, #aa00ff);
            color: white; padding: 12px 24px; border-radius: 30px;
            font-weight: 600; font-size: 0.9rem;
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);
            opacity: 0; transition: all 0.3s ease;
            z-index: 9999; display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* ---------- BOTTOM NAVIGATION BAR ---------- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: none;
            color: #8ea8c4;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 80px;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-item.active {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        .nav-item.active svg {
            filter: drop-shadow(0 0 5px #00ffff);
        }

        /* Search Input inside Bottom Nav (Hidden by default, shown when clicked) */
        .search-input-wrapper {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 90%;
            max-width: 500px;
            background: rgba(12, 18, 26, 0.95);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            display: flex;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 1001;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        .search-input-wrapper.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .search-input {
            flex: 1; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 8px;
            padding: 10px 14px; color: #fff; font-size: 0.95rem;
            outline: none;
        }
        .search-btn {
            background: linear-gradient(135deg, #00c8ff, #aa00ff);
            border: none; border-radius: 8px; padding: 0 15px;
            color: #fff; font-weight: bold; cursor: pointer;
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.5rem; }
            .title { font-size: 0.9rem; }
            .page-btn { width: 40px; height: 40px; font-size: 0.9rem; }
            .action-row { gap: 8px; }
            .icon-btn { width: 44px; height: 44px; }
            .icon-btn svg { width: 18px; height: 18px; }
            .play-btn { font-size: 0.9rem; padding: 0.7rem 0; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1 id="homeBtn">Desi Gallery</h1>
        </div>

        <div class="info-bar" id="infoBar">
            Total: <span id="totalVideos">0</span> | Page: <span id="currentPageInfo">-</span> / <span id="lastPageInfo">-</span>
        </div>

        <div id="videoContainer" class="video-grid">
            <div class="status">⚡ loading videos ...</div>
        </div>

        <div class="pagination" id="paginationSection">
            <div id="pageNumbers" class="page-numbers"></div>
            <div class="goto-wrapper">
                <label for="gotoInput">GO TO</label>
                <input id="gotoInput" class="goto-input" type="number" min="1" placeholder="#">
                <button id="gotoBtn" class="goto-btn">GO</button>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast">✅ Link Copied!</div>

    <!-- HIDDEN SEARCH BAR (Shows up when search icon is clicked) -->
    <div class="search-input-wrapper" id="searchWrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Search videos...">
        <button id="searchBtn" class="search-btn">🔍</button>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <div class="bottom-nav">
        <button class="nav-item active" id="navHome">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Home</span>
        </button>
        <button class="nav-item" id="navSearch">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>Search</span>
        </button>
        <button class="nav-item" id="navHistory">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>History</span>
        </button>
        <button class="nav-item" id="navWatchlist">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            <span>My List</span>
        </button>
    </div>

    <script>
        (function() {
            // ---------- TELEGRAM INIT & BACK BUTTON ----------
            const tg = window.Telegram?.WebApp;
            let isSubMode = false;

            if (tg) {
                tg.ready();
                tg.expand();
                tg.BackButton.onClick(() => {
                    if (isSubMode) document.getElementById('navHome').click();
                    else tg.close();
                });
            }

            // ---------- CONFIG ----------
            const API_BASE = "https://teradiskadda.in/api/v1/videos?page=";
            const SEARCH_API = "https://app.teradiskadda.in/api/search?q=";
            const PER_PAGE = 100; // UPDATED: 100 Videos per page
            const BOT_BASE = "https://t.me/neon_player_bot/app?startapp=";
            const MAX_PAGE_BUTTONS = 5;

            // ---------- STATE ----------
            let currentPage = 1;
            let totalPages = 1;
            let isSearchMode = false;
            let isWatchlistMode = false;
            let isHistoryMode = false;
            let currentSearchQuery = "";

            // DOM Elements
            const videoContainer = document.getElementById('videoContainer');
            const pageNumbersEl = document.getElementById('pageNumbers');
            const gotoInput = document.getElementById('gotoInput');
            const gotoBtn = document.getElementById('gotoBtn');
            const paginationSection = document.getElementById('paginationSection');
            const totalVideosEl = document.getElementById('totalVideos');
            const currentPageInfoEl = document.getElementById('currentPageInfo');
            const lastPageInfoEl = document.getElementById('lastPageInfo');
            
            // Bottom Nav Elements
            const navHome = document.getElementById('navHome');
            const navSearch = document.getElementById('navSearch');
            const navHistory = document.getElementById('navHistory');
            const navWatchlist = document.getElementById('navWatchlist');
            
            // Search Elements
            const searchWrapper = document.getElementById('searchWrapper');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            
            const toastEl = document.getElementById('toast');

            // ---------- HELPERS ----------
            function updateBackButton() {
                if (!tg || !tg.BackButton) return;
                if (isSubMode) tg.BackButton.show();
                else tg.BackButton.hide();
            }

            function showToast(message) {
                toastEl.innerHTML = message;
                toastEl.classList.add('show');
                setTimeout(() => toastEl.classList.remove('show'), 2500);
            }

            function setActiveNav(activeBtn) {
                [navHome, navSearch, navHistory, navWatchlist].forEach(btn => btn.classList.remove('active'));
                if (activeBtn) activeBtn.classList.add('active');
            }

            function copyToClipboard(text) {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(() => showToast('✅ Link Copied!')).catch(() => fallbackCopy(text));
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed"; textArea.style.left = "-999999px";
                document.body.appendChild(textArea); textArea.focus(); textArea.select();
                try { document.execCommand('copy'); showToast('✅ Link Copied!'); } 
                catch (err) { showToast('❌ Failed to copy'); }
                textArea.remove();
            }

            async function shareLink(title, url) {
                const shareData = { title, text: 'Watch this video on Desi Gallery!', url };
                if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
                    try { await navigator.share(shareData); return; } 
                    catch (err) { if (err.name !== 'AbortError') console.log('Share failed', err); return; }
                }
                const tgShareUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`;
                window.open(tgShareUrl, '_blank');
            }

            function getPlayerUrl(link) {
                let id = "";
                try {
                    if (link.includes('surl=')) {
                        const urlParams = new URLSearchParams(link.split('?')[1]);
                        id = urlParams.get('surl') || "";
                    } 
                    if (!id) {
                        const urlObj = new URL(link);
                        const pathParts = urlObj.pathname.split('/').filter(Boolean);
                        id = pathParts[pathParts.length - 1] || "";
                    }
                } catch (e) {
                    if (link.includes('surl=')) id = link.split('surl=')[1].split('&')[0];
                    else id = link.split('/').pop().split('?')[0];
                }
                return BOT_BASE + id.split('?')[0].split('&')[0].split('/')[0];
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ---------- WATCHLIST & HISTORY LOGIC ----------
            function getWatchlist() { try { return JSON.parse(localStorage.getItem('neonWatchlist')) || []; } catch(e) { return []; } }
            function getHistory() { try { return JSON.parse(localStorage.getItem('neonHistory')) || []; } catch(e) { return []; } }

            function toggleWatchlist(video, btnElement) {
                let list = getWatchlist();
                const index = list.findIndex(v => (v.id === video.id) || (v.link === video.link));
                
                if (index > -1) {
                    list.splice(index, 1);
                    btnElement.classList.remove('saved');
                    btnElement.textContent = '🤍';
                    showToast('🗑️ Removed from Watchlist');
                } else {
                    const safeVideo = { id: video.id, title: video.title, thumbnail: video.thumbnail, size: video.size, link: video.link || video.url };
                    list.unshift(safeVideo); // Latest top par
                    btnElement.classList.add('saved');
                    btnElement.textContent = '🔖';
                    showToast('⭐ Added to Watchlist');
                }
                localStorage.setItem('neonWatchlist', JSON.stringify(list));
            }

            function addToHistory(video) {
                let history = getHistory();
                history = history.filter(v => (v.id !== video.id) && (v.link !== (video.link || video.url)));
                const safeVideo = { id: video.id, title: video.title, thumbnail: video.thumbnail, size: video.size, link: video.link || video.url };
                history.unshift(safeVideo);
                if(history.length > 50) history = history.slice(0, 50);
                localStorage.setItem('neonHistory', JSON.stringify(history));
            }

            // ---------- RENDER VIDEOS ----------
            function renderVideos(videos) {
                if (!videos || videos.length === 0) {
                    videoContainer.innerHTML = `<div class="status">✨ No videos found here.</div>`;
                    return;
                }

                const watchlist = getWatchlist();
                let html = '';

                const copyIcon = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
                const shareIcon = `<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;

                videos.forEach(video => {
                    const title = video.title || 'Untitled video';
                    const thumbnail = video.thumbnail || 'https://via.placeholder.com/640x360/1a1f2a/00ffff?text=NO+THUMB';
                    const link = video.link || video.url;
                    const playerUrl = getPlayerUrl(link);
                    const size = video.size || 'Unknown';
                    
                    const isSaved = watchlist.some(v => (v.id === video.id) || (v.link === link));
                    const bookmarkClass = isSaved ? 'saved' : '';
                    const bookmarkIcon = isSaved ? '🔖' : '🤍';

                    const safeTitle = escapeHtml(title).replace(/'/g, "\\'");
                    const safeUrl = escapeHtml(playerUrl);

                    html += `
                        <div class="card">
                            <div class="thumb-wrapper">
                                <img src="${thumbnail}" alt="thumb" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22640%22 height=%22360%22%3E%3Crect width=%22640%22 height=%22360%22 fill=%22%23111822%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2220%22 fill=%22%2300ffff88%22 text-anchor=%22middle%22 dy=%22.3em%22%3EThumbnail Expired%3C/text%3E%3C/svg%3E'">
                                <button class="bookmark-btn ${bookmarkClass}" data-id="${video.id}" data-link="${link}">${bookmarkIcon}</button>
                            </div>
                            <div class="title-row">
                                <div class="title" title="${escapeHtml(title)}">${escapeHtml(title)}</div>
                                <div class="size-badge">📦 ${escapeHtml(size)}</div>
                            </div>
                            <div class="action-row">
                                <a href="${playerUrl}" target="_blank" rel="noopener noreferrer" class="play-btn" data-id="${video.id}">▶ PLAY</a>
                                <button class="icon-btn copy-btn" data-url="${safeUrl}" title="Copy Link">${copyIcon}</button>
                                <button class="icon-btn share-btn" data-url="${safeUrl}" data-title="${safeTitle}" title="Share">${shareIcon}</button>
                            </div>
                        </div>
                    `;
                });

                videoContainer.innerHTML = html;

                document.querySelectorAll('.bookmark-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        const id = this.getAttribute('data-id');
                        const link = this.getAttribute('data-link');
                        const video = videos.find(v => v.id == id || (v.link || v.url) === link);
                        if (video) toggleWatchlist(video, this);
                    });
                });

                document.querySelectorAll('.play-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const id = this.getAttribute('data-id');
                        const video = videos.find(v => v.id == id);
                        if (video) addToHistory(video);
                    });
                });

                document.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        copyToClipboard(this.getAttribute('data-url'));
                    });
                });

                document.querySelectorAll('.share-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        shareLink(this.getAttribute('data-title'), this.getAttribute('data-url'));
                    });
                });
            }

            // ---------- BUILD PAGINATION ----------
            function buildPageButtons() {
                if (isWatchlistMode || isHistoryMode) {
                    paginationSection.style.display = 'none';
                    return;
                }
                paginationSection.style.display = 'flex';
                pageNumbersEl.innerHTML = '';

                const half = Math.floor(MAX_PAGE_BUTTONS / 2);
                let startPage = Math.max(1, currentPage - half);
                let endPage = startPage + MAX_PAGE_BUTTONS - 1;

                if (startPage === 1) endPage = MAX_PAGE_BUTTONS;
                if (endPage > totalPages) endPage = totalPages;
                if (startPage > endPage) startPage = Math.max(1, endPage - MAX_PAGE_BUTTONS + 1);

                const prevBtn = document.createElement('button');
                prevBtn.className = 'page-btn nav-btn';
                prevBtn.innerHTML = '&#9664;';
                prevBtn.disabled = (currentPage <= 1);
                prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
                pageNumbersEl.appendChild(prevBtn);

                for (let p = startPage; p <= endPage; p++) {
                    const btn = document.createElement('button');
                    btn.className = 'page-btn' + (p === currentPage ? ' active' : '');
                    btn.textContent = p;
                    btn.addEventListener('click', () => goToPage(p));
                    pageNumbersEl.appendChild(btn);
                }

                const nextBtn = document.createElement('button');
                nextBtn.className = 'page-btn nav-btn';
                nextBtn.innerHTML = '&#9654;';
                nextBtn.disabled = (currentPage >= totalPages);
                nextBtn.addEventListener('click', () => {
                    if (!nextBtn.disabled) goToPage(currentPage + 1);
                });
                pageNumbersEl.appendChild(nextBtn);
            }

            // ---------- FETCH FUNCTIONS ----------
            async function fetchPage(page) {
                if (page < 1) return;
                isSearchMode = false; isWatchlistMode = false; isHistoryMode = false; isSubMode = false;
                searchWrapper.classList.remove('show');
                setActiveNav(navHome);
                currentPage = page; updateBackButton();

                videoContainer.innerHTML = `<div class="status">⚡ loading page ${page} ...</div>`;
                pageNumbersEl.innerHTML = '<div style="color:#557788;font-size:0.85rem;padding:0.6rem;">loading...</div>';

                try {
                    const response = await fetch(`${API_BASE}${page}&per_page=${PER_PAGE}`);
                    const json = await response.json();
                    if (!json.data || !Array.isArray(json.data)) throw new Error('Invalid format');

                    totalPages = json.last_page || 1;
                    totalVideosEl.textContent = json.total ? json.total.toLocaleString() : 0;
                    currentPageInfoEl.textContent = page;
                    lastPageInfoEl.textContent = totalPages.toLocaleString();

                    renderVideos(json.data);
                    buildPageButtons();
                } catch (error) {
                    videoContainer.innerHTML = `<div class="status error">❌ Failed to load videos.</div>`;
                }
            }

            async function fetchSearch(query, page = 1) {
                if (!query) return;
                isSearchMode = true; isWatchlistMode = false; isHistoryMode = false; isSubMode = true;
                setActiveNav(navSearch);
                currentSearchQuery = query; currentPage = page; updateBackButton();

                videoContainer.innerHTML = `<div class="status">🔍 Searching "${escapeHtml(query)}" ...</div>`;
                pageNumbersEl.innerHTML = '';

                try {
                    const response = await fetch(`${SEARCH_API}${encodeURIComponent(query)}&page=${page}&limit=${PER_PAGE}`);
                    const json = await response.json();
                    if (!json.ok || !json.results) throw new Error('Invalid search format');

                    totalPages = json.lastPage || 1;
                    totalVideosEl.textContent = json.total ? json.total.toLocaleString() : 0;
                    currentPageInfoEl.textContent = json.currentPage || 1;
                    lastPageInfoEl.textContent = totalPages.toLocaleString();

                    renderVideos(json.results);
                    buildPageButtons();
                } catch (error) {
                    videoContainer.innerHTML = `<div class="status error">❌ Search failed.</div>`;
                }
            }

            function showWatchlist() {
                isWatchlistMode = true; isSearchMode = false; isHistoryMode = false; isSubMode = true;
                searchWrapper.classList.remove('show');
                setActiveNav(navWatchlist);
                currentPage = 1; updateBackButton();

                const list = getWatchlist();
                totalVideosEl.textContent = list.length;
                currentPageInfoEl.textContent = "1"; lastPageInfoEl.textContent = "1";

                if (list.length === 0) videoContainer.innerHTML = `<div class="status">📭 Your watch list is empty.</div>`;
                else renderVideos(list);
                buildPageButtons();
            }

            function showHistory() {
                isHistoryMode = true; isWatchlistMode = false; isSearchMode = false; isSubMode = true;
                searchWrapper.classList.remove('show');
                setActiveNav(navHistory);
                currentPage = 1; updateBackButton();

                const list = getHistory();
                totalVideosEl.textContent = list.length;
                currentPageInfoEl.textContent = "1"; lastPageInfoEl.textContent = "1";

                if (list.length === 0) videoContainer.innerHTML = `<div class="status">🕒 You haven't watched any videos yet.</div>`;
                else renderVideos(list);
                buildPageButtons();
            }

            function goToPage(page) {
                if (isWatchlistMode || isHistoryMode) return; 
                if (isSearchMode) fetchSearch(currentSearchQuery, page);
                else fetchPage(page);
            }

            // ---------- EVENT LISTENERS ----------
            
            // Bottom Nav Events
            navHome.addEventListener('click', () => fetchPage(1));
            navHistory.addEventListener('click', showHistory);
            navWatchlist.addEventListener('click', showWatchlist);
            
            // Search Toggle
            navSearch.addEventListener('click', () => {
                searchWrapper.classList.toggle('show');
                if (searchWrapper.classList.contains('show')) {
                    searchInput.focus();
                }
            });

            // Search Actions
            const performSearch = () => {
                const q = searchInput.value.trim();
                if (q) {
                    searchWrapper.classList.remove('show'); // Hide input after search
                    fetchSearch(q, 1);
                }
            };
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(); });

            // Title click to Home
            document.getElementById('homeBtn').addEventListener('click', () => fetchPage(1));

            gotoBtn.addEventListener('click', () => {
                const raw = gotoInput.value.trim();
                if (!raw) return;
                const p = parseInt(raw, 10);
                if (p >= 1 && p <= totalPages) { gotoInput.value = ''; goToPage(p); }
            });
            gotoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') gotoBtn.click(); });

            // ---------- INIT ----------
            fetchPage(1);
        })();
    </script>
</body>
</html>
