<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Desi Gallery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #0a0c10;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            padding: 1rem 0.75rem 90px;
            min-height: 100vh;
            color: #e0f0ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 10%, rgba(0, 255, 255, 0.08) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(255, 0, 255, 0.08) 0%, transparent 35%),
                        radial-gradient(circle at 40% 90%, rgba(0, 200, 255, 0.06) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .app { max-width: 720px; width: 100%; margin: 0 auto; }

        .header {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 1rem; padding: 0.5rem 0;
        }

        .header h1 {
            font-size: 1.8rem; font-weight: 800; letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00ffff, #aa00ff, #ff00ff);
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.4));
            cursor: pointer;
        }

        .info-bar {
            width: 100%; text-align: center; font-size: 0.85rem;
            color: #00ffffaa; margin-bottom: 1rem; letter-spacing: 0.5px;
        }
        .info-bar span { color: #fff; font-weight: 600; }

        .video-grid { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem; min-height: 60vh; }

        .card {
            background: rgba(12, 18, 26, 0.85); backdrop-filter: blur(8px);
            border-radius: 24px; overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.2), 0 8px 20px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .thumb-wrapper {
            width: 100%; background: #05080c; overflow: hidden;
            position: relative; line-height: 0; min-height: 150px;
        }

        .thumb-wrapper img { width: 100%; height: auto; display: block; object-fit: contain; }

        .bookmark-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%; width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.2rem; color: #888;
            transition: all 0.3s; z-index: 5; backdrop-filter: blur(5px);
        }
        .bookmark-btn.saved { color: #00ffff; border-color: #00ffff; box-shadow: 0 0 15px #00ffff88; }

        .title-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 10px; padding: 0.9rem 1rem 0.4rem;
        }

        .title {
            font-size: 0.95rem; font-weight: 500; line-height: 1.4;
            color: #ffffffdd; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; flex: 1;
        }

        .size-badge {
            background: rgba(0, 255, 255, 0.1); border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff; font-size: 0.75rem; font-weight: 700;
            padding: 0.25rem 0.6rem; border-radius: 20px; white-space: nowrap;
        }

        .action-row { display: flex; gap: 10px; margin: 0.6rem 1rem 1.2rem; }

        .play-btn {
            flex: 1; background: linear-gradient(90deg, #00c8ff, #aa00ff);
            border: none; border-radius: 60px; padding: 0.8rem 0;
            text-align: center; font-weight: 700; font-size: 1rem;
            letter-spacing: 1.5px; color: #fff; text-decoration: none;
            box-shadow: 0 0 15px #00aaff;
            display: flex; align-items: center; justify-content: center;
        }

        .icon-btn {
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(0, 255, 255, 0.1); border: 1px solid rgba(0, 255, 255, 0.4);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #00ffff; transition: all 0.3s;
        }
        .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .pagination { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; margin-top: 1.5rem; }
        .page-numbers { display: flex; justify-content: center; align-items: center; gap: 0.6rem; flex-wrap: wrap; }

        .page-btn {
            background: rgba(10, 20, 25, 0.4); border: 1px solid rgba(0, 255, 255, 0.4);
            color: #88ddff; font-weight: 600; font-size: 1rem; border-radius: 50%;
            cursor: pointer; width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
        }
        .page-btn.active {
            background: linear-gradient(135deg, #00c8ff, #aa00ff);
            border: 1px solid #fff; color: #fff; box-shadow: 0 0 20px #00c8ff; transform: scale(1.1);
        }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .goto-wrapper {
            display: flex; align-items: center; background: rgba(5, 15, 20, 0.6);
            border: 2px solid #00ffff77; border-radius: 50px; padding: 0.3rem;
        }
        .goto-wrapper label { font-size: 0.85rem; font-weight: bold; color: #00ffff; padding: 0 1rem; }
        .goto-input {
            width: 65px; background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(0, 255, 255, 0.3); border-radius: 50px;
            padding: 0.5rem; color: #fff; font-weight: bold; text-align: center; outline: none;
        }
        .goto-btn {
            background: linear-gradient(135deg, #00c8ff, #aa00ff);
            border: none; border-radius: 50px; padding: 0.5rem 1.2rem;
            color: #fff; font-weight: 800; cursor: pointer; margin-left: 0.3rem;
        }

        .loading-box {
            text-align: center; padding: 3rem 1rem; font-size: 1.1rem;
            color: #00ffff; background: #0d141ecc;
            border-radius: 20px; border: 1px solid #00ffff44;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            box-shadow: inset 0 0 20px rgba(0,255,255,0.1);
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(0,255,255,0.2);
            border-top-color: #00ffff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(10, 12, 16, 0.98); backdrop-filter: blur(15px);
            border-top: 1px solid rgba(0, 255, 255, 0.3);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0; z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            background: transparent; border: none; color: #8ea8c4;
            font-size: 0.75rem; font-weight: 600; cursor: pointer;
            width: 80px; outline: none; transition: all 0.2s;
        }
        .nav-item svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-item.active { color: #00ffff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.6); }
        .nav-item.active svg { filter: drop-shadow(0 0 5px #00ffff); }
        
        .nav-item.spin svg { animation: spin 1s linear infinite; }

        .search-input-wrapper {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 500px;
            background: rgba(12, 18, 26, 0.98); padding: 10px;
            border-radius: 12px; border: 1px solid rgba(0, 255, 255, 0.5);
            display: none; gap: 10px; z-index: 1001;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
        }
        .search-input-wrapper.show { display: flex; }

        .search-input {
            flex: 1; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 8px;
            padding: 10px 14px; color: #fff; font-size: 0.95rem; outline: none;
        }
        .search-btn {
            background: linear-gradient(135deg, #00c8ff, #aa00ff);
            border: none; border-radius: 8px; padding: 0 15px;
            color: #fff; font-weight: bold; cursor: pointer;
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.5rem; }
            .title { font-size: 0.9rem; }
            .page-btn { width: 40px; height: 40px; font-size: 0.9rem; }
            .action-row { gap: 8px; }
            .icon-btn { width: 44px; height: 44px; }
            .play-btn { font-size: 0.9rem; padding: 0.7rem 0; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1 id="homeBtn">Desi Gallery</h1>
        </div>

        <div class="info-bar" id="infoBar">
            Total: <span id="totalVideos">0</span> | Page: <span id="currentPageInfo">-</span> / <span id="lastPageInfo">-</span>
        </div>

        <div id="videoContainer" class="video-grid">
        </div>

        <div class="pagination" id="paginationSection">
            <div id="pageNumbers" class="page-numbers"></div>
            <div class="goto-wrapper">
                <label for="gotoInput">GO TO</label>
                <input id="gotoInput" class="goto-input" type="number" min="1" placeholder="#">
                <button id="gotoBtn" class="goto-btn">GO</button>
            </div>
        </div>
    </div>
    
    <div class="search-input-wrapper" id="searchWrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Search videos...">
        <button id="searchBtn" class="search-btn">🔍</button>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" id="navHome">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Home</span>
        </button>
        <button class="nav-item" id="navRefresh">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            <span>Refresh</span>
        </button>
        <button class="nav-item" id="navSearch">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>Search</span>
        </button>
        <button class="nav-item" id="navHistory">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>History</span>
        </button>
        <button class="nav-item" id="navWatchlist">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            <span>My List</span>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram?.WebApp;
            if (tg) { tg.ready(); tg.expand(); }

            const API_BASE = "https://teradiskadda.in/api/v1/videos?page=";
            const SEARCH_API = "https://app.teradiskadda.in/api/search?q=";
            const PER_PAGE = 100;
            const BOT_BASE = "https://t.me/neon_player_bot/app?startapp=";
            const MAX_PAGE_BUTTONS = 5;

            let currentPage = 1;
            let totalPages = 1;
            let isSearchMode = false;
            let isWatchlistMode = false;
            let isHistoryMode = false;
            let currentSearchQuery = "";
            let currentVideosData = [];
            let homeScrollPosition = 0;

            let homeCache = { page: 0, totalPages: 1, totalVideos: 0, data: null };

            const videoContainer = document.getElementById('videoContainer');
            const pageNumbersEl = document.getElementById('pageNumbers');
            const gotoInput = document.getElementById('gotoInput');
            const gotoBtn = document.getElementById('gotoBtn');
            const paginationSection = document.getElementById('paginationSection');
            const totalVideosEl = document.getElementById('totalVideos');
            const currentPageInfoEl = document.getElementById('currentPageInfo');
            const lastPageInfoEl = document.getElementById('lastPageInfo');
            
            const navHome = document.getElementById('navHome');
            const navRefresh = document.getElementById('navRefresh');
            const navSearch = document.getElementById('navSearch');
            const navHistory = document.getElementById('navHistory');
            const navWatchlist = document.getElementById('navWatchlist');
            
            const searchWrapper = document.getElementById('searchWrapper');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            function setActiveNav(activeBtn) {
                document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
                if (activeBtn) activeBtn.classList.add('active');
            }

            function toggleTGButton(show) {
                if (!tg || !tg.BackButton) return;
                if (show) tg.BackButton.show(); else tg.BackButton.hide();
            }

            function showLoadingUI() {
                videoContainer.innerHTML = `<div class="loading-box"><div class="spinner"></div><span>Loading...</span></div>`;
                window.scrollTo(0, 0); 
            }

            function escapeHtml(text) {
                if (!text) return '';
                return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            }

            function getPlayerUrl(link) {
                let id = "";
                try {
                    if (link.includes('surl=')) id = new URLSearchParams(link.split('?')[1]).get('surl');
                    if (!id) id = new URL(link).pathname.split('/').filter(Boolean).pop();
                } catch (e) {
                    id = link.split('surl=')[1] ? link.split('surl=')[1].split('&')[0] : link.split('/').pop().split('?')[0];
                }
                return BOT_BASE + (id || "").split('?')[0].split('&')[0].split('/')[0];
            }

            // ==========================================
            // THUMBNAIL FIX LOGIC (TeraBox API Se Naya Link)
            // ==========================================
            async function refreshThumbnail(videoLink, imgElement) {
                try {
                    // TeraBox ke API se naya thumbnail fetch karne ki koshish
                    const res = await fetch(`https://getindevice.com/api/download/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: videoLink })
                    });
                    const data = await res.json();
                    
                    // Check karo ki naya thumbnail mila ya nahi
                    let newThumb = null;
                    if (data.videos && data.videos.length > 0) newThumb = data.videos[0].thumbnail;
                    else if (data.photos && data.photos.length > 0) newThumb = data.photos[0].thumbnail;
                    
                    if (newThumb) {
                        imgElement.src = newThumb;
                        imgElement.style.opacity = '1'; // Fade-in effect
                    } else {
                        // Fallback placeholder
                        imgElement.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22640%22 height=%22360%22%3E%3Crect width=%22640%22 height=%22360%22 fill=%22%23111822%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2220%22 fill=%22%2300ffff88%22 text-anchor=%22middle%22 dy=%22.3em%22%3ENo Thumbnail%3C/text%3E%3C/svg%3E';
                    }
                } catch (e) {
                    console.log("Thumbnail refresh failed", e);
                }
            }

            function copyToClipboard(text) {
                if (navigator.clipboard) navigator.clipboard.writeText(text);
                else {
                    const t = document.createElement("textarea");
                    t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
                }
            }

            function shareLink(title, url) {
                if (navigator.share) navigator.share({ title, text: 'Watch this video!', url }).catch(()=>{});
                else window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`, '_blank');
            }

            function getWatchlist() { try { return JSON.parse(localStorage.getItem('neonWatchlist')) || []; } catch(e) { return []; } }
            function getHistory() { try { return JSON.parse(localStorage.getItem('neonHistory')) || []; } catch(e) { return []; } }

            function updateWatchlistInStorage(video) {
                let list = getWatchlist();
                const index = list.findIndex(v => (v.id === video.id) || (v.link === video.link));
                if (index > -1) {
                    list.splice(index, 1);
                    return false; 
                } else {
                    list.unshift(video);
                    localStorage.setItem('neonWatchlist', JSON.stringify(list));
                    return true; 
                }
            }

            function addToHistory(video) {
                let history = getHistory();
                history = history.filter(v => (v.id !== video.id) && (v.link !== (video.link || video.url)));
                history.unshift({ id: video.id, title: video.title, thumbnail: video.thumbnail, size: video.size, link: video.link || video.url });
                if(history.length > 50) history = history.slice(0, 50); 
                localStorage.setItem('neonHistory', JSON.stringify(history));
            }

            function renderVideos(videos) {
                currentVideosData = videos; 
                
                if (!videos || videos.length === 0) {
                    videoContainer.innerHTML = `<div class="loading-box" style="color:#88ddff;border-color:#88ddff44"><span>✨ No videos found here.</span></div>`;
                    return;
                }

                const watchlist = getWatchlist();
                let html = '';
                const svgCopy = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
                const svgShare = `<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;

                videos.forEach((video, index) => {
                    const title = escapeHtml(video.title || 'Untitled video');
                    const thumbnail = video.thumbnail || '';
                    const link = video.link || video.url;
                    const playerUrl = getPlayerUrl(link);
                    const size = escapeHtml(video.size || 'Unknown');
                    
                    const isSaved = watchlist.some(v => (v.id === video.id) || (v.link === link));
                    const bClass = isSaved ? 'saved' : '';
                    const bIcon = isSaved ? '🔖' : '🤍';

                    html += `
                        <div class="card">
                            <div class="thumb-wrapper">
                                <img src="${thumbnail}" alt="thumb" loading="lazy" 
                                     onerror="this.style.opacity='0.5'; window.refreshThumbnail('${link}', this)"
                                     onload="this.style.opacity='1'">
                                <button class="bookmark-btn ${bClass}" data-index="${index}">${bIcon}</button>
                            </div>
                            <div class="title-row">
                                <div class="title">${title}</div>
                                <div class="size-badge">📦 ${size}</div>
                            </div>
                            <div class="action-row">
                                <a href="${playerUrl}" target="_blank" class="play-btn" data-index="${index}">▶ PLAY</a>
                                <button class="icon-btn copy-btn" data-index="${index}">${svgCopy}</button>
                                <button class="icon-btn share-btn" data-index="${index}">${svgShare}</button>
                            </div>
                        </div>
                    `;
                });
                videoContainer.innerHTML = html;
            }

            // Global function banaya taaki onerror se call ho sake
            window.refreshThumbnail = refreshThumbnail;

            videoContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('button') || e.target.closest('a.play-btn');
                if (!btn) return;

                const index = btn.getAttribute('data-index');
                const video = currentVideosData[index];
                if (!video) return;

                const link = video.link || video.url;
                const playerUrl = getPlayerUrl(link);

                if (btn.classList.contains('bookmark-btn')) {
                    const isAdded = updateWatchlistInStorage({ id: video.id, title: video.title, thumbnail: video.thumbnail, size: video.size, link: link });
                    btn.classList.toggle('saved');
                    btn.textContent = isAdded ? '🔖' : '🤍';
                } 
                else if (btn.classList.contains('copy-btn')) {
                    copyToClipboard(playerUrl);
                    btn.style.color = '#a3ff12';
                    setTimeout(() => btn.style.color = '', 500);
                } 
                else if (btn.classList.contains('share-btn')) {
                    shareLink(video.title, playerUrl);
                }
                else if (btn.classList.contains('play-btn')) {
                    addToHistory(video);
                }
            });

            function buildPageButtons() {
                if (isWatchlistMode || isHistoryMode) { paginationSection.style.display = 'none'; return; }
                paginationSection.style.display = 'flex';
                pageNumbersEl.innerHTML = '';

                const half = Math.floor(MAX_PAGE_BUTTONS / 2);
                let start = Math.max(1, currentPage - half);
                let end = start + MAX_PAGE_BUTTONS - 1;
                if (start === 1) end = MAX_PAGE_BUTTONS;
                if (end > totalPages) end = totalPages;
                if (start > end) start = Math.max(1, end - MAX_PAGE_BUTTONS + 1);

                const createBtn = (txt, p, active = false, disabled = false) => {
                    const b = document.createElement('button');
                    b.className = 'page-btn' + (active ? ' active' : '');
                    b.innerHTML = txt;
                    b.disabled = disabled;
                    if (!disabled && !active) b.onclick = () => goToPage(p);
                    return b;
                };

                pageNumbersEl.appendChild(createBtn('&#9664;', currentPage - 1, false, currentPage <= 1));
                for (let p = start; p <= end; p++) pageNumbersEl.appendChild(createBtn(p, p, p === currentPage));
                pageNumbersEl.appendChild(createBtn('&#9654;', currentPage + 1, false, currentPage >= totalPages));
            }

            function fetchPage(page, forceRefresh = false) {
                if (page < 1) return;
                
                if (!isSearchMode && !isWatchlistMode && !isHistoryMode) homeScrollPosition = window.scrollY;

                if (!forceRefresh && homeCache.page === page && homeCache.data) {
                    isSearchMode = false; isWatchlistMode = false; isHistoryMode = false;
                    searchWrapper.classList.remove('show');
                    setActiveNav(navHome); toggleTGButton(false); currentPage = page;
                    
                    totalPages = homeCache.totalPages;
                    totalVideosEl.textContent = homeCache.totalVideos;
                    currentPageInfoEl.textContent = page;
                    lastPageInfoEl.textContent = totalPages.toLocaleString();
                    paginationSection.style.display = 'flex';

                    renderVideos(homeCache.data); buildPageButtons();
                    setTimeout(() => { window.scrollTo(0, homeScrollPosition); }, 50);
                    return; 
                }

                isSearchMode = false; isWatchlistMode = false; isHistoryMode = false;
                searchWrapper.classList.remove('show');
                setActiveNav(navHome); toggleTGButton(false); currentPage = page;

                showLoadingUI();
                paginationSection.style.display = 'flex';
                pageNumbersEl.innerHTML = '';
                homeScrollPosition = 0;

                fetch(`${API_BASE}${page}&per_page=${PER_PAGE}`)
                    .then(res => res.json())
                    .then(json => {
                        if (!json.data) throw new Error('Invalid format');
                        totalPages = json.last_page || 1;
                        const totalVidStr = json.total ? json.total.toLocaleString() : 0;
                        
                        totalVideosEl.textContent = totalVidStr;
                        currentPageInfoEl.textContent = page;
                        lastPageInfoEl.textContent = totalPages.toLocaleString();

                        homeCache = { page, totalPages, totalVideos: totalVidStr, data: json.data };
                        renderVideos(json.data); buildPageButtons();
                    })
                    .catch(err => {
                        videoContainer.innerHTML = `<div class="loading-box" style="color:#ff6b9d;border-color:#ff6b9d44"><span>❌ Failed to load videos.</span></div>`;
                    })
                    .finally(() => navRefresh.classList.remove('spin'));
            }

            function fetchSearch(query, page = 1) {
                if (!query) return;
                isSearchMode = true; isWatchlistMode = false; isHistoryMode = false;
                setActiveNav(navSearch); toggleTGButton(true);
                currentSearchQuery = query; currentPage = page;

                showLoadingUI();
                paginationSection.style.display = 'flex';
                pageNumbersEl.innerHTML = '';

                fetch(`${SEARCH_API}${encodeURIComponent(query)}&page=${page}&limit=${PER_PAGE}`)
                    .then(res => res.json())
                    .then(json => {
                        if (!json.ok) throw new Error('Invalid search format');
                        totalPages = json.lastPage || 1;
                        totalVideosEl.textContent = json.total ? json.total.toLocaleString() : 0;
                        currentPageInfoEl.textContent = json.currentPage || 1;
                        lastPageInfoEl.textContent = totalPages.toLocaleString();
                        renderVideos(json.results); buildPageButtons();
                    })
                    .catch(err => {
                        videoContainer.innerHTML = `<div class="loading-box" style="color:#ff6b9d;border-color:#ff6b9d44"><span>❌ Search failed.</span></div>`;
                    })
                    .finally(() => navRefresh.classList.remove('spin'));
            }

            function showWatchlist() {
                if (!isSearchMode && !isWatchlistMode && !isHistoryMode) homeScrollPosition = window.scrollY;
                if (isWatchlistMode) { window.scrollTo(0,0); return; }

                isWatchlistMode = true; isSearchMode = false; isHistoryMode = false;
                searchWrapper.classList.remove('show');
                setActiveNav(navWatchlist); toggleTGButton(true); currentPage = 1;

                const list = getWatchlist();
                totalVideosEl.textContent = list.length;
                currentPageInfoEl.textContent = "1"; lastPageInfoEl.textContent = "1";
                
                renderVideos(list); buildPageButtons(); window.scrollTo(0,0);
            }

            function showHistory() {
                if (!isSearchMode && !isWatchlistMode && !isHistoryMode) homeScrollPosition = window.scrollY;
                if (isHistoryMode) { window.scrollTo(0,0); return; }

                isHistoryMode = true; isWatchlistMode = false; isSearchMode = false;
                searchWrapper.classList.remove('show');
                setActiveNav(navHistory); toggleTGButton(true); currentPage = 1;

                const list = getHistory();
                totalVideosEl.textContent = list.length;
                currentPageInfoEl.textContent = "1"; lastPageInfoEl.textContent = "1";

                renderVideos(list); buildPageButtons(); window.scrollTo(0,0);
            }

            function goToPage(page) {
                if (isWatchlistMode || isHistoryMode) return;
                if (isSearchMode) fetchSearch(currentSearchQuery, page);
                else fetchPage(page);
            }

            navHome.addEventListener('click', () => fetchPage(currentPage));
            navHistory.addEventListener('click', showHistory);
            navWatchlist.addEventListener('click', showWatchlist);
            
            navRefresh.addEventListener('click', () => {
                navRefresh.classList.add('spin');
                if (isWatchlistMode) { showWatchlist(); setTimeout(() => navRefresh.classList.remove('spin'), 500); }
                else if (isHistoryMode) { showHistory(); setTimeout(() => navRefresh.classList.remove('spin'), 500); }
                else if (isSearchMode) { fetchSearch(currentSearchQuery, 1); }
                else { homeCache.page = 0; fetchPage(currentPage, true); }
            });

            navSearch.addEventListener('click', () => {
                searchWrapper.classList.toggle('show');
                if (searchWrapper.classList.contains('show')) setTimeout(() => searchInput.focus(), 50);
            });

            const doSearch = () => {
                const q = searchInput.value.trim();
                if (q) { searchWrapper.classList.remove('show'); fetchSearch(q, 1); }
            };
            searchBtn.addEventListener('click', doSearch);
            searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

            document.getElementById('homeBtn').addEventListener('click', () => fetchPage(1));

            gotoBtn.addEventListener('click', () => {
                const p = parseInt(gotoInput.value.trim(), 10);
                if (p >= 1 && p <= totalPages) { gotoInput.value = ''; goToPage(p); }
            });
            gotoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') gotoBtn.click(); });

            fetchPage(1);
        });
    </script>
</body>
</html>
